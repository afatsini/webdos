<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebDOS - DOS Games in Browser</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts - Press Start 2P for retro gaming feel -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Custom styling -->
    <link rel="stylesheet" href="/styles.css">
    <!-- Socket.io client library -->
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <!-- Pixel pattern overlay -->
    <div class="pixel-pattern"></div>

    <!-- Header -->
    <header class="page-header">
        <div class="container text-center">
            <h1 class="page-title">WebDOS</h1>
            <p class="page-subtitle">Classic DOS Games in Your Browser</p>
            <div class="dos-prompt">LOAD GAME</div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="collection-heading">Games <span id="game-count" class="game-count">0</span></h2>
            <div id="connection-status" class="connection-status" title="Real-time updates status">
                <i class="fas fa-sync-alt"></i>
            </div>
        </div>

        <div id="games-container" class="games-container">
            <div class="loading-container">
                <div class="loading-spinner">
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <div class="loading-text">LOADING GAMES...</div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container text-center">
            <p class="footer-text">&copy; 2025 WebDOS - Bringing classic DOS games back to life</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="/scripts.js"></script>
</body>

</html>
