<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebDOS - DOS Games in Browser</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .games-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .game-image-container {
            position: relative;
            width: 100%;
            height: 250px;
            overflow: hidden;
            background-color: #111;
        }

        .game-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .game-card:hover .game-image {
            transform: scale(1.05);
        }

        .game-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .game-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .loading {
            text-align: center;
            font-size: 20px;
            color: #666;
            padding: 30px;
        }

        .play-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: auto;
            transition: background-color 0.2s;
        }

        .play-button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <h1>WebDOS - DOS Games Collection</h1>

    <div id="games-container" class="games-container">
        <div class="loading">Loading games...</div>
    </div>

    <script>
        // Feature 1 & 2: Game Listing with Cover Images - Frontend implementation
        document.addEventListener('DOMContentLoaded', () => {
            fetchGames();

            // Function to fetch games from our API
            async function fetchGames() {
                try {
                    const response = await fetch('/api/games');
                    if (!response.ok) {
                        throw new Error('Failed to fetch games');
                    }
                    const games = await response.json();
                    displayGames(games);
                } catch (error) {
                    console.error('Error fetching games:', error);
                    document.getElementById('games-container').innerHTML =
                        '<div class="loading">Error loading games. Please try again later.</div>';
                }
            }

            // Function to display the games on the page
            function displayGames(games) {
                const container = document.getElementById('games-container');

                if (games.length === 0) {
                    container.innerHTML = '<div class="loading">No games found. Add ZIP files to the games folder.</div>';
                    return;
                }

                // Clear loading message
                container.innerHTML = '';

                // Create a card for each game
                games.forEach(game => {
                    const gameCard = document.createElement('div');
                    gameCard.className = 'game-card';

                    // Feature 2: Use the cover path provided by the backend
                    // If no cover is found, the backend will set the coverPath to the placeholder
                    const coverPath = game.coverPath;

                    gameCard.innerHTML = `
                        <div class="game-image-container">
                            <img src="${coverPath}" alt="${game.name}" class="game-image" onerror="this.src='/placeholder.jpg'">
                        </div>
                        <div class="game-info">
                            <div class="game-name">${game.name}</div>
                            <button class="play-button" data-game-path="${game.path}">Play Game</button>
                        </div>
                    `;

                    container.appendChild(gameCard);
                });

                // Add event listeners to play buttons (will be implemented in Feature 5)
                document.querySelectorAll('.play-button').forEach(button => {
                    button.addEventListener('click', function () {
                        const gamePath = this.getAttribute('data-game-path');
                        console.log(`Play button clicked for game: ${gamePath}`);
                        // This will be implemented in Feature 5
                    });
                });
            }
        });
    </script>
</body>

</html>
